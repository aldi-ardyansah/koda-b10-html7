<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main">
        <div class="screen">
            <span>0</span>
        </div>
        <div class="buttons">
            <button class="btn-light-grey"><img src="resource/backspace.svg" alt="clear"></button>
            <button class="btn-light-grey">AC</button>
            <button class="btn-light-grey">%</button>
            <button class="btn-orange">÷</button>
            <button class="btn-grey">7</button>
            <button class="btn-grey">8</button>
            <button class="btn-grey">9</button>
            <button class="btn-orange">×</button>
            <button class="btn-grey">4</button>
            <button class="btn-grey">5</button>
            <button class="btn-grey">6</button>
            <button class="btn-orange">−</button>
            <button class="btn-grey">1</button>
            <button class="btn-grey">2</button>
            <button class="btn-grey">3</button>
            <button class="btn-orange">+</button>
            <button class="btn-grey">+/-</button>
            <button class="btn-grey">0</button>
            <button class="btn-grey">.</button>
            <button class="btn-orange">=</button>
        </div>
    </main>
</body>
</html>

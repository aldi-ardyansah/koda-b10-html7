<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main">
        <div class="screen">
            <span id="screen"></span>
        </div>
        <div class="buttons">
            <button id="btn-backspace" class="btn-light-grey"><img src="resource/backspace.svg" alt="clear"></button>
            <button id="btn-ac" class="btn-light-grey">AC</button>
            <button id="btn-persen" class="btn-light-grey">%</button>
            <button id="btn-divide" class="btn-orange">÷</button>
            <button id="btn-7" class="btn-grey">7</button>
            <button id="btn-8" class="btn-grey">8</button>
            <button id="btn-9" class="btn-grey">9</button>
            <button id="btn-multiply" class="btn-orange">×</button>
            <button id="btn-4" class="btn-grey">4</button>
            <button id="btn-5" class="btn-grey">5</button>
            <button id="btn-6" class="btn-grey">6</button>
            <button id="btn-minus" class="btn-orange">−</button>
            <button id="btn-1" class="btn-grey">1</button>
            <button id="btn-2" class="btn-grey">2</button>
            <button id="btn-3" class="btn-grey">3</button>
            <button id="btn-plus" class="btn-orange">+</button>
            <button id="btn-plus-minus" class="btn-grey">+/-</button>
            <button id="btn-0" class="btn-grey">0</button>
            <button id="btn-comma" class="btn-grey">.</button>
            <button id="btn-equal" class="btn-orange">=</button>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>
</html>
